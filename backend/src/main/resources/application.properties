spring.application.name=backend

# Configuration de la base de données
spring.datasource.url=jdbc:mysql://localhost:3306/cadeauxhubliste
spring.datasource.username=cadeaux_user
spring.datasource.password=secure4@cdx

# Configuration de JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Configuration des logs pour Hibernate en mode debug
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Port de l'API
server.port=8080
